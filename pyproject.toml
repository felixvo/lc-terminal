[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "leet"
version = "0.2.0"
description = "Terminal LeetCode practice: pick, solve, run, submit, track and review."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lc = "leet.cli:main"
leet = "leet.cli:main"

[tool.setuptools]
packages = ["leet"]

[tool.setuptools.package-data]
leet = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
